[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/monarch-core", "crates/monarch-app", "crates/monarch-egs"]

[profile.release]
strip = true
lto = true
opt-level = 3

[workspace.dependencies]
dotenv = "0.15.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
monarch_egs = { path = "crates/monarch-egs" }
monarch_core = { path = "crates/monarch-core" }
monarch_app = { path = "crates/monarch-app" }
tracing = { version = "0.1.41", features = [
  "max_level_trace",
  "release_max_level_info",
] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
anyhow = "1.0.86"
thiserror = "2"
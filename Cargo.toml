[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/monarch", "crates/monarch_egs"]

[profile.release]
strip = true
lto = true
opt-level = 3

[workspace.dependencies]
dotenv = "0.15.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
monarch_egs = { path = "crates/monarch_egs" }

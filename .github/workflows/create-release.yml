name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf

      - name: build
        env:
          MONARCH_URL: https://api.monarch-launcher.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo build --release ${{ matrix.args }}

      - name: prepare artifact
        id: prepare
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            ARCH="${{ matrix.args == '--target aarch64-apple-darwin' && 'arm64' || 'x64' }}"
            NAME="monarch-${VERSION}-macos-${ARCH}"
            BINARY="target/${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}/release/monarch"
          elif [[ "${{ matrix.platform }}" == "ubuntu-24.04" ]]; then
            NAME="monarch-${VERSION}-linux-x64"
            BINARY="target/release/monarch"
          else
            NAME="monarch-${VERSION}-windows-x64"
            BINARY="target/release/monarch.exe"
          fi
          
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp "$BINARY" "$NAME.exe"
            echo "path=$NAME.exe" >> $GITHUB_OUTPUT
          else
            cp "$BINARY" "$NAME"
            echo "path=$NAME" >> $GITHUB_OUTPUT
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.name }}
          path: ${{ steps.prepare.outputs.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monarch-${{ github.event.inputs.version }}
          name: "Monarch ${{ github.event.inputs.version }}"
          draft: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
